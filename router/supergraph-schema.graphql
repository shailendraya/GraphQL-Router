schema
  @link(url: "https://specs.apollo.dev/link/v1.0")
  @link(url: "https://specs.apollo.dev/join/v0.3", for: EXECUTION)
  @link(url: "https://specs.apollo.dev/tag/v0.3")
  @link(url: "https://specs.apollo.dev/inaccessible/v0.2", for: SECURITY)
  @link(
    url: "https://myspecs.dev/myDirective/v1.0"
    import: ["@myDirective", { name: "@anotherDirective", as: "@hello" }]
  ) {
  query: Query
}

directive @hello on FIELD_DEFINITION

directive @inaccessible on FIELD_DEFINITION | OBJECT | INTERFACE | UNION | ARGUMENT_DEFINITION | SCALAR | ENUM | ENUM_VALUE | INPUT_OBJECT | INPUT_FIELD_DEFINITION

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__field(
  graph: join__Graph
  requires: join__FieldSet
  provides: join__FieldSet
  type: String
  external: Boolean
  override: String
  usedOverridden: Boolean
) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__implements(
  graph: join__Graph!
  interface: String!
) repeatable on OBJECT | INTERFACE

directive @join__type(
  graph: join__Graph!
  key: join__FieldSet
  extension: Boolean! = false
  resolvable: Boolean! = true
  isInterfaceObject: Boolean! = false
) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__unionMember(
  graph: join__Graph!
  member: String!
) repeatable on UNION

directive @link(
  url: String
  as: String
  for: link__Purpose
  import: [link__Import]
) repeatable on SCHEMA

directive @myDirective(a: String!) on FIELD_DEFINITION

directive @tag(
  name: String!
) repeatable on FIELD_DEFINITION | OBJECT | INTERFACE | UNION | ARGUMENT_DEFINITION | SCALAR | ENUM | ENUM_VALUE | INPUT_OBJECT | INPUT_FIELD_DEFINITION | SCHEMA
scalar join__FieldSet

enum join__Graph {
  PLANTS @join__graph(name: "plants", url: "http://localhost:4300/graphql")
  USERS @join__graph(name: "users", url: "http://localhost:4200/graphql")
}

scalar link__Import

enum link__Purpose {
  SECURITY
  EXECUTION
}

type Plant @join__type(graph: PLANTS, key: "id") {
  id: ID!
  name: String!
  species: String!
  description: String
  imageUrl: String
  email: String!
  lastUpdated: String!
}

input PlantInput @join__type(graph: "PLANTS") {
  name: String!
  species: String!
  description: String
  imageUrl: String
}

type Query @join__type(graph: PLANTS) @join__type(graph: USERS) {
  getPlants: [Plant!]! @join__field(graph: PLANTS)
  getPlantById(id: ID!): Plant @join__field(graph: PLANTS)
  me(email: String!): User @join__field(graph: USERS)
}

type Mutation @join__type(graph: PLANTS) @join__type(graph: USERS) {
  addPlant(input: PlantInput!, userId: ID!): Plant! @join__field(graph: PLANTS)
  updatePlant(id: ID!, input: PlantInput!, userId: ID!): Plant!
    @join__field(graph: PLANTS)
  registerUser(input: RegisterUserInput!): User @join__field(graph: USERS)
  loginUser(input: LoginUserInput!): String @join__field(graph: USERS)
}

type User @join__type(graph: USERS, key: "id") {
  id: ID!
  email: String!
  password: String!
  phone: String!
  role: UserRole
}

enum UserRole @join__type(graph: "USERS") {
  USER
  ADMIN
}

input RegisterUserInput @join__type(graph: "USERS") {
  email: String!
  password: String!
  phone: String!
}

input LoginUserInput @join__type(graph: "USERS") {
  email: String!
  password: String!
}
